{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm p-4 mb-4">
    <h3 class="fw-bold mb-3">Busca Rápida de Assistidos (RF01)</h3>
    <form method="GET" action="/" class="row g-2 mb-4">
        <div class="col-md-9">
            <input type="text" name="q" value="{{ query }}" class="form-control touch-target" placeholder="Buscar por Nome ou Matrícula...">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary touch-target w-100 fw-bold">Pesquisar</button>
        </div>
    </form>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-primary">
                <tr><th>Matrícula</th><th>Nome do Assistido</th><th>Diagnóstico</th><th>Ações</th></tr>
            </thead>
            <tbody>
                {% for p in pacientes %}
                <tr>
                    <td><span class="badge bg-secondary">{{ p.matricula }}</span></td>
                    <td class="fw-bold">{{ p.nome }}</td>
                    <td>{{ p.diagnostico }}</td>
                    <td>
                        <a href="/atendimento/" class="btn btn-success btn-sm touch-target">Atender</a>
                        <a href="/historico/" class="btn btn-info btn-sm touch-target text-white">Histórico</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted p-4">Nenhum assistido encontrado.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
