<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestalozzi Maceió - Prontuário PDI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .touch-target { min-height: 48px; min-width: 48px; display: inline-flex; align-items: center; justify-content: center; }
        .high-contrast { background-color: #000 !important; color: #fff !important; }
        .high-contrast .card, .high-contrast .navbar, .high-contrast table { background-color: #121212 !important; color: #fff !important; border: 1px solid #ffeb3b !important; }
        .high-contrast a, .high-contrast .btn-primary { background-color: #ffeb3b !important; color: #000 !important; font-weight: bold !important; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Pestalozzi Maceió | PDI</a>
            <div class="d-flex gap-2">
                <a href="/" class="btn btn-outline-light touch-target btn-sm">Assistidos</a>
                <a href="/atendimento/" class="btn btn-outline-light touch-target btn-sm">Novo Atendimento</a>
                <a href="/historico/" class="btn btn-outline-light touch-target btn-sm">Linha do Tempo</a>
                <button class="btn btn-warning touch-target btn-sm fw-bold" onclick="document.body.classList.toggle('high-contrast')">Alto Contraste</button>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
